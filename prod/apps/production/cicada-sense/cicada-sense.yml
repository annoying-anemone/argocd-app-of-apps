---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicada-sense-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/application-repository: cicada-sense
    argocd.argoproj.io/environment: "production"
    argocd.argoproj.io/sync-wave: "1"
  labels:
    layer: applications
    service: cicada-sense
    component: main
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: cicada-sense-production
    server: https://192.168.200.102:443
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
  sources:
    - repoURL: ghcr.io/annoying-anemone/cicada-sense/charts/application
      targetRevision: "" # Will be updated by deploy workflow
      chart: cicada-sense
      helm:
        values: |
          backend:
            ingress:
                hosts:
                  - host: cicada-sense.user-00.hoverkraft.cloud
          frontend:
            ingress:
                hosts:
                  - host: cicada-sense.user-00.hoverkraft.cloud
          live-data-generator:
            api:
                ingress:
                  hosts:
                      - host: cicada-sense-generator.user-00.hoverkraft.cloud
            ui:
                ingress:
                  hosts:
                      - host: cicada-sense-generator.user-00.hoverkraft.cloud
