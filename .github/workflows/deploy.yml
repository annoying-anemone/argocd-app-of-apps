name: "Deploy ArgoCD App of Apps"

on:
  repository_dispatch:
    types: [deploy, finish-deploy, clean-deploy]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.action == 'deploy' }}
    uses: hoverkraft-tech/ci-github-publish/.github/workflows/deploy-argocd-app-of-apps.yml@a0a9d185c51c10710a5987822e78feb2b5ce1932 # ratchet:hoverkraft-tech/ci-github-publish/.github/workflows/deploy-argocd-app-of-apps.yml@0.29.0
    permissions:
      contents: read
      pull-requests: write
    with:
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  finish-deploy:
    if: ${{ github.event.action == 'finish-deploy' }}
    uses: hoverkraft-tech/ci-github-publish/.github/workflows/finish-deploy-argocd-app-of-apps.yml@a0a9d185c51c10710a5987822e78feb2b5ce1932 # ratchet:hoverkraft-tech/ci-github-publish/.github/workflows/finish-deploy-argocd-app-of-apps.yml@0.29.0
    permissions:
      actions: read
      contents: read
      deployments: write
      issues: write
      pull-requests: write
    with:
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  auto-finish-deploy:
    if: ${{ github.event.action == 'deploy' }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Wait before finishing deployment
        run: sleep 180

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # ratchet:actions/create-github-app-token@v3.3.0
        id: generate-token
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }} # reusable workflow token override is intentional

      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # ratchet:peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          event-type: finish-deploy
          client-payload: |
            {
                "deployment-id": "${{ needs.deploy.outputs.deployment-id }}",
                "application-repository": "${{ needs.deploy.outputs.repository }}",
                "urls": ["https://${{ needs.deploy.outputs.url }}"],
                "status": "Synced",
                "description": "deployment successful"
            }

  clean-deploy:
    if: ${{ github.event.action == 'clean-deploy' }}
    uses: hoverkraft-tech/ci-github-publish/.github/workflows/clean-deploy-argocd-app-of-apps.yml@a0a9d185c51c10710a5987822e78feb2b5ce1932 # ratchet:hoverkraft-tech/ci-github-publish/.github/workflows/clean-deploy-argocd-app-of-apps.yml@0.29.0
    permissions:
      contents: read
      pull-requests: write
    with:
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
